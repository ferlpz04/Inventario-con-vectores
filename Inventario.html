<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        class Producto {
            constructor(codigo, nombre, cantidad, costo) {
                this.codigo = codigo;
                this.nombre = nombre;
                this.cantidad = cantidad;
                this.costo = costo;
            }
            
            info() {
                return "Código: " + this.codigo + " ~ " + this.nombre + " ~ Cantidad: " + this.cantidad + " ~ Costo: $" + this.costo;
            }
        }
        class Inventario {
            constructor() {
                this.productos = [];
            }
            agregar(producto) {
                this.productos.push(producto);
            }
            agregarInicio(producto) {
                for (let i = this.productos.length; i > 0; i--) {
                    this.productos[i] = this.productos[i - 1];
                }
                this.productos[0] = producto;
            }
            insertar(producto, posicion) {
                if (posicion < 0 || posicion > this.productos.length) return;
                for (let i = this.productos.length; i > posicion; i--) {
                    this.productos[i] = this.productos[i - 1];
                }
                this.productos[posicion] = producto;
            }
            buscar(codigo) {
                for (let i = 0; i < this.productos.length; i++) {
                    if (this.productos[i].codigo === codigo) {
                        return this.productos[i];
                    }
                }
                return null;
            }
            eliminar(codigo) {
                let posicion = -1;
                for (let i = 0; i < this.productos.length; i++) {
                    if (this.productos[i].codigo === codigo) {
                        posicion = i;
                        break;
                    }
                }
                if (posicion !== -1) {
                    let eliminado = this.productos[posicion];
                    for (let i = posicion; i < this.productos.length - 1; i++) {
                        this.productos[i] = this.productos[i + 1];
                    }
                    this.productos.pop();
                    return eliminado;
                }
                return null;
            }
            extraerPrimero() {
                if (this.productos.length === 0) return null;
                let primero = this.productos[0];
                for (let i = 0; i < this.productos.length - 1; i++) {
                    this.productos[i] = this.productos[i + 1];
                }
                this.productos.pop();
                return primero;
            }
            listar() {
                let texto = "";
                for (let i = 0; i < this.productos.length; i++) {
                    texto += this.productos[i].info() + "\n";
                }
                return texto;
            }
        }

        let inventario=new Inventario();
        let nuevo=new Producto(1,"Lapiz",100,10); //hay 100 y cuestan 20
        inventario.agregar(nuevo);
        nuevo=new Producto(2,"Borrador",200,20); 
        inventario.agregar(nuevo);
        nuevo=new Producto(3,"Cuaderno",300,30);
        inventario.agregar(nuevo);
        nuevo=new Producto(4,"Clips",20,10); 
        inventario.agregarInicio(nuevo);
        nuevo=new Producto(5,"Sacapuntas",500,50); 
        inventario.agregar(nuevo);
        console.log(inventario.listar())
        inventario.eliminar(3);
        console.log(inventario.listar())
        
        let res=inventario.buscar(10);

console.log("No existe");

console.log(res.info());
res=inventario.extraerPrimero();

</script>
